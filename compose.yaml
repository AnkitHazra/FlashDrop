services:
  quickshare:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      UPLOAD_DIR: /data/temp_uploads
      DATABASE_PATH: /data/quickshare.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - quickshare_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  quickshare_data:
